<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Hinglish STT</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e3e0; --accent:#e5484d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#1f1f22; --ink:#eee; --mute:#9a9aa0; --line:#2e2e33; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 20px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
  input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  button { font:inherit; font-weight:600; padding:9px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.on { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(229,72,77,.18); } }
  #status { color:var(--mute); }
  #out { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-height:160px; }
  .final { margin:0 0 8px; font-size:17px; }
  .final small { color:var(--mute); font-size:12px; margin-left:6px; }
  #partial { color:var(--mute); font-style:italic; font-size:17px; }
</style>
</head>
<body>
<main>
  <h1>Live Hinglish speech-to-text</h1>
  <p class="sub">Start, then talk. Each sentence is sent to the GPU when you pause.</p>
  <div class="bar">
    <input id="token" type="password" placeholder="Access token" autocomplete="off">
    <button id="btn">Start</button>
    <span id="status">Idle</span>
  </div>
  <div id="out"><div id="finals"></div><div id="partial"></div></div>
</main>

<script>
// Downsamples the mic to 16 kHz mono 16-bit PCM and posts ~100 ms chunks.
const WORKLET = `
class Pcm16k extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; this.buf = new Int16Array(1600); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const i = Math.floor(this.pos), f = this.pos - i;
      const s = i + 1 < ch.length ? ch[i] * (1 - f) + ch[i + 1] * f : ch[i];
      this.buf[this.n++] = Math.max(-1, Math.min(1, s)) * 0x7fff;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(1600); this.n = 0; }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor('pcm16k', Pcm16k);`;

const btn = document.getElementById('btn'), statusEl = document.getElementById('status');
const tokenEl = document.getElementById('token'), finalsEl = document.getElementById('finals'), partialEl = document.getElementById('partial');
let ws, ctx, mic;

tokenEl.value = new URLSearchParams(location.search).get('token') || '';

async function start() {
  btn.disabled = true;
  statusEl.textContent = 'Connecting…';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(tokenEl.value)}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ready') startMic();
    else if (m.type === 'partial') partialEl.textContent = m.text + ' …';
    else if (m.type === 'final') {
      partialEl.textContent = '';
      if (!m.text) return;
      const p = document.createElement('p');
      p.className = 'final';
      p.textContent = m.text;
      p.insertAdjacentHTML('beforeend', `<small>${m.audio_s}s · ${m.latency_s}s</small>`);
      finalsEl.append(p);
    } else if (m.type === 'error') statusEl.textContent = 'Error: ' + m.message;
  };
  ws.onclose = e => { stopMic(); statusEl.textContent = e.code === 1008 ? 'Wrong token' : 'Disconnected'; };
}

async function startMic() {
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    statusEl.textContent = 'Microphone blocked: ' + e.message;
    ws.close();
    return;
  }
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
  const node = new AudioWorkletNode(ctx, 'pcm16k');
  node.port.onmessage = e => ws.readyState === WebSocket.OPEN && ws.send(e.data);
  ctx.createMediaStreamSource(mic).connect(node);
  btn.disabled = false; btn.textContent = 'Stop'; btn.classList.add('on');
  statusEl.textContent = 'Listening';
}

function stopMic() {
  mic?.getTracks().forEach(t => t.stop());
  ctx?.close();
  mic = ctx = null;
  btn.disabled = false; btn.textContent = 'Start'; btn.classList.remove('on');
}

function stop() {
  stopMic();
  statusEl.textContent = 'Finishing…';
  ws.send(JSON.stringify({ type: 'end' }));
  ws.addEventListener('message', e => { if (JSON.parse(e.data).type === 'done') ws.close(); });
}

btn.onclick = () => (mic ? stop() : start());
</script>
</body>
</html>
